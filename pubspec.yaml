name: shop
description: "Application ENAGNON LEADER de gestion des points de vente."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.4
  bloc: ^8.1.2
  http: ^1.6.0
  equatable: ^2.0.5
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  file_saver: ^0.3.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/enagnon_leader_logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/enagnon_leader_logo.jpeg"
  remove_alpha_ios: true
  min_sdk_android: 21